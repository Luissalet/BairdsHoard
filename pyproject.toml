[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bairds-hoard"
version = "0.1.0"
description = "Live view, screenshots, instant clips and recordings of another computer through an HDMI capture device, with drag-out files and an MCP bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bairds-hoard = "baird_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["baird_hoard*"]

[tool.setuptools.package-data]
baird_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
